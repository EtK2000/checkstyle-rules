multiline.lambda.not.on.opening.paren=Inline block argument: must be on the opening paren line.
multiline.ternary.colon.wrong.line=Ternary '':'' must be on the line immediately after the true branch.
multiline.ternary.not.on.closing.paren=Single-line ternary argument: closing paren must be on the same line.
multiline.ternary.not.on.opening.paren=Ternary argument: condition must be on the opening paren line.
multiline.ternary.question.wrong.line=Ternary ''?'' must be on the line immediately after the condition.
no.array.trailing.comma=No trailing comma in array initializer.
no.blank.line.after.braced.case=No blank line after braced case, the closing brace provides separation.
no.blank.line.between.single.cases=No blank line between single-line switch cases.
no.case.braces=Unnecessary braces in case block, only use braces when a variable is defined in the case''s scope.
no.unnecessary.this=Unnecessary ''this.{0}'', only use when shadowing or in field assignment.
overload.method.order=Overload ''{0}'' with {1} parameters must appear before overload with {2} parameters.
overload.method.type.order=Overload ''{0}({1})'' must appear before ''{0}({2})''.
prefer.api.getFirst=Use ''.getFirst()'' instead of ''.get(0)''.
prefer.api.getLast=Use ''.getLast()'' instead of ''.get(size() - 1)''.
