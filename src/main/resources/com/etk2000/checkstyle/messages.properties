prefer.api.removeFirst=Use ''.removeFirst()'' instead of ''.remove(0)''.
prefer.api.removeLast=Use ''.removeLast()'' instead of ''.remove(size() - 1)''.
prefer.api.toList=Use ''.toList()'' instead of ''.collect(Collectors.toList())''.
prefer.import=Use an import instead of fully qualified name ''{0}''.
prefer.lambda=Use a lambda expression instead of anonymous ''{0}''.
prefer.literal.suffix=Use ''{0}'' suffix on ''{1}'' instead of a cast.
