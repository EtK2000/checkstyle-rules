empty.infinite.while=Empty infinite while loop, this will hang.
empty.switch=Empty switch statement, remove it (preserve any side effects in the expression).
empty.while=Empty while body, remove it (preserve any side effects in the condition).
field.sort.chunk=Field ''{0}'' ({1}) must appear before {2} fields.
