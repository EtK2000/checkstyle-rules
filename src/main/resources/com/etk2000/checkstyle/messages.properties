record.formatting.component.on.opening.paren=First record component must not share the line with the opening paren.
record.formatting.empty.body.braces.split=Empty record body must be '''{}''' on one line.
record.formatting.non.empty.body.braces.same.line=Non-empty record body must place ''}'' on its own line.
record.formatting.open.brace.bad.spacing=Record opening brace must have exactly one space before it.
record.formatting.open.brace.not.on.anchor.line=Record opening brace must be on the same line as the closing paren (or implements clause).
record.formatting.skip.empty.body.content=cannot collapse the empty record body: content around its braces would be lost
record.formatting.skip.header.line.comment=cannot reformat the record header: it contains a line comment
record.formatting.skip.header.multiline.span=cannot reformat the record header: it spans a multi-line comment or text block
record.formatting.skip.open.brace.anchor=cannot move the opening brace: its anchor line ends in a comment or an unterminated literal
redundant.array.creation=Remove the redundant array creation for the varargs parameter of ''{0}''.
redundant.array.creation.skip.multiline=cannot remove the array creation: the initializer spans multiple lines
redundant.array.creation.skip.nested.initializer=cannot remove the array creation: its elements are nested array initializers
redundant.cast=Remove the redundant cast to ''{0}'' (the expression is already ''{1}'').
redundant.cast.skip.malformed=cannot remove the cast: no expression follows it
redundant.cast.skip.multiline=cannot remove the cast: it spans multiple lines
redundant.equality.branch=Use ''{0}'' directly instead of the redundant equality if-else.
redundant.equality.skip.comment=cannot collapse the if-else: a comment in it would be lost
redundant.modifier.skip.stale.column=cannot remove the modifier: the letter run at the violation column is not a JLS modifier keyword, likely a stale column from a prior same-line rewrite (re-run after the conflicting fixer settles)
redundant.numeric.suffix=Remove the redundant ''{0}'' suffix.
switch.case.order={0} ''{1}'' must appear before ''{2}''.
thread.annotation.missing=Class ''{0}'' must have a thread annotation (''@AnyThread'', ''@MainThread'', etc.).
unused.imports.skip.malformed=cannot remove the import: it does not parse as a single 'import [static] X.Y;' statement
unused.imports.skip.now.used=cannot remove the import: a sibling fix in this pass now references its simple name